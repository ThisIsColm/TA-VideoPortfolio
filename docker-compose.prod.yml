version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3021"
    environment:
      - NODE_ENV=production
      - PORT=3021
      - DATABASE_URL=file:./database.sqlite3
      - CORS_ORIGIN=https://ta-portflio.colmmoore.com
      - GHOST_API_URL=${GHOST_API_URL}
      - GHOST_CONTENT_KEY=${GHOST_CONTENT_KEY}
    volumes:
      - data-volume:/app/apps/api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  data-volume:
  caddy_data:
  caddy_config:
